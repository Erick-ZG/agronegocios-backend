services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coronado
      POSTGRES_PASSWORD: coronado
      POSTGRES_DB: agronegocios
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coronado -d agronegocios']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
